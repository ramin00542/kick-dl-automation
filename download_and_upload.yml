name: Download (Split if Needed) & Upload to File Hosts

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک فایل (یا چند لینک با فاصله) - پشتیبانی از mega.nz'
        required: true
        type: string
      mode:
        description: 'حالت دانلود (normal یا zip)'
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      link_password:
        description: 'رمز لینک (HTTP Basic Auth) - اختیاری'
        required: false
        type: string
      file_password:
        description: 'رمز داخلی فایل - اختیاری'
        required: false
        type: string
      target_sites:
        description: 'سایت‌های مقصد برای آپلود (با کاما جدا کنید)'
        required: true
        type: string
        default: 'erfanzadeh.ir'
      upload_mode:
        description: 'حالت آپلود (تک فایل کامل یا تکه تکه)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - parts
  push:
    branches:
      - "**"

jobs:
  # Job 1: Parse inputs from commit message (for push triggers)
  parse:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'github:') ||
      contains(github.event.head_commit.message, 'github-zip:')
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.resolve.outputs.urls }}
      handling: ${{ steps.resolve.outputs.handling }}
      link_password: ${{ steps.resolve.outputs.link_password }}
      file_password: ${{ steps.resolve.outputs.file_password }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "urls=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
            echo "handling=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "link_password=${{ github.event.inputs.link_password }}" >> $GITHUB_OUTPUT
            echo "file_password=${{ github.event.inputs.file_password }}" >> $GITHUB_OUTPUT
          else
            MSG=$(git log -1 --pretty=%B)
            if echo "$MSG" | grep -qP 'github-zip:'; then
              URLS=$(echo "$MSG" | grep -oP 'github-zip:\s*\K.*')
              HANDLING="zip"
            else
              URLS=$(echo "$MSG" | grep -oP 'github:\s*\K.*')
              HANDLING="normal"
            fi
            echo "urls=$URLS" >> $GITHUB_OUTPUT
            echo "handling=$HANDLING" >> $GITHUB_OUTPUT
            echo "link_password=" >> $GITHUB_OUTPUT
            echo "file_password=" >> $GITHUB_OUTPUT
          fi

  # Job 2: Process using reusable workflow
  process:
    needs: parse
    uses: ./.github/workflows/_reusable-process.yml
    with:
      source: "direct"
      urls: "${{ needs.parse.outputs.urls }}"
      handling: "${{ needs.parse.outputs.handling }}"
      target_sites: "${{ github.event.inputs.target_sites || 'erfanzadeh.ir' }}"
      upload_mode: "${{ github.event.inputs.upload_mode || 'full' }}"
      link_password: "${{ needs.parse.outputs.link_password }}"
      file_password: "${{ needs.parse.outputs.file_password }}"
    secrets:
      SITE_CREDENTIALS: ${{ secrets.SITE_CREDENTIALS }}
