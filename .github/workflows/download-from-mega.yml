name: دانلود از MEGA یا Pixeldrain و ذخیره در مخزن

on:
  workflow_dispatch:
    inputs:
      source:
        description: '📦 mega=از mega.nz (پشتیبانی رمز), pixeldrain=از pixeldrain.com (API)'
        required: true
        default: 'pixeldrain'
        type: choice
        options:
          - mega
          - pixeldrain
      mega_link:
        description: '🔗 لینک فایل یا پوشه MEGA (فقط وقتی source=mega). مثال: https://mega.nz/file/abc123#key'
        required: false
        default: ''
        type: string
      pixeldrain_link:
        description: '🔗 لینک فایل Pixeldrain (فقط وقتی source=pixeldrain). مثال: https://pixeldrain.com/u/abc123'
        required: false
        default: ''
        type: string
      handling:
        description: '⚙️ normal=نگه‌داشتن اسم+split, zip=ZIP+split, single_zip=ZIP+split, full=کپی ساده, individual=جدا+split'
        required: false
        default: 'individual_split'
        type: choice
        options:
          - normal
          - zip
          - single_zip_split
          - full_file_no_split
          - individual_split
      split_size:
        description: '📏 حجم هر تکه بر حسب مگابایت (پیش‌فرض 90، فقط در حالت custom استفاده میشه)'
        required: false
        default: 90
        type: string
      split_mode:
        description: '🤖 auto=هوشمند بر اساس نوع فایل, custom=دستی با split_size'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - custom
  push:
    branches:
      - main
      - master

jobs:
  # Job 1: Parse inputs from commit message (for push triggers)
  parse:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'mega:') ||
      contains(github.event.head_commit.message, 'mega-zip:') ||
      contains(github.event.head_commit.message, 'mega-full:') ||
      contains(github.event.head_commit.message, 'pixeldrain:')
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      urls: ${{ steps.resolve.outputs.urls }}
      handling: ${{ steps.resolve.outputs.handling }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE="${{ github.event.inputs.source }}"
            HANDLING="${{ github.event.inputs.handling }}"
            if [ "$SOURCE" = "mega" ]; then
              URLS="${{ github.event.inputs.mega_link }}"
            else
              URLS="${{ github.event.inputs.pixeldrain_link }}"
            fi
          else
            MSG=$(git log -1 --pretty=%B)
            if echo "$MSG" | grep -qP 'pixeldrain:'; then
              SOURCE="pixeldrain"
              HANDLING="single_zip_split"
              URLS=$(echo "$MSG" | grep -oP 'pixeldrain:\s*\K.*')
            elif echo "$MSG" | grep -qP 'mega-full:'; then
              SOURCE="mega"
              HANDLING="full_file_no_split"
              URLS=$(echo "$MSG" | grep -oP 'mega-full:\s*\K.*')
            elif echo "$MSG" | grep -qP 'mega-zip:'; then
              SOURCE="mega"
              HANDLING="single_zip_split"
              URLS=$(echo "$MSG" | grep -oP 'mega-zip:\s*\K.*')
            elif echo "$MSG" | grep -qP 'mega:'; then
              SOURCE="mega"
              HANDLING="individual_split"
              URLS=$(echo "$MSG" | grep -oP 'mega:\s*\K.*')
            else
              echo "❌ No valid command found in commit message"
              exit 1
            fi
          fi
          # Use heredoc to preserve special characters (#, &, etc.) in URLs
          echo "source<<GHEOF" >> $GITHUB_OUTPUT
          echo "$SOURCE" >> $GITHUB_OUTPUT
          echo "GHEOF" >> $GITHUB_OUTPUT
          echo "urls<<GHEOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "GHEOF" >> $GITHUB_OUTPUT
          echo "handling<<GHEOF" >> $GITHUB_OUTPUT
          echo "$HANDLING" >> $GITHUB_OUTPUT
          echo "GHEOF" >> $GITHUB_OUTPUT

  # Job 2: Process using reusable workflow
  save-file:
    needs: parse
    permissions:
      contents: write
    uses: ./.github/workflows/_reusable-process.yml
    with:
      source: "${{ needs.parse.outputs.source }}"
      urls: "${{ needs.parse.outputs.urls }}"
      handling: "${{ needs.parse.outputs.handling }}"
      split_size: ${{ github.event.inputs.split_size || 90 }}
      split_mode: ${{ github.event.inputs.split_mode || 'auto' }}
    secrets:
      MEGA_LINK_PASSWORD: ${{ secrets.MEGA_LINK_PASSWORD }}
